<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>-login-</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<style>
  html, body { margin:0; }
  #app { min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:"Hiragino Sans","Meiryo",sans-serif; color:#333; }
  .card { width:100%; max-width:380px; background:#fff; border-radius:18px; box-shadow:0 6px 20px rgba(0,0,0,0.15); overflow:hidden; }

  #entrance { padding:28px 24px; text-align:center; }
  .logo { font-size:48px; }
  #entrance h1 { margin:6px 0 4px; font-size:22px; }
  .sub { margin:0 0 20px; font-size:13px; color:#888; }
  label { display:block; text-align:left; font-size:12px; color:#666; margin:12px 0 4px; }
  #entrance input { width:100%; box-sizing:border-box; padding:12px; font-size:16px; border:2px solid #ddd; border-radius:10px; outline:none; }
  #entrance input:focus { border-color:#000; }
  .main-btn { width:100%; margin-top:22px; padding:13px; font-size:16px; font-weight:bold; color:#fff; background:#000; border:none; border-radius:10px; cursor:pointer; }
  .main-btn:hover { background:#333; }

  #chat { width:100%; max-width:1180px; height:100vh; flex-direction:column; background:#7494c0; }
  .header { background:#143563; color:#fff; padding:10px 16px; font-size:17px; font-weight:bold; text-align:left; display:flex; align-items:center; gap:8px; }
  .back-btn { background:none; border:none; color:#fff; font-size:30px; line-height:1; padding:0 8px 4px 0; cursor:pointer; }
  #log { flex:1; min-height:0; overflow:auto; padding:14px; }
  .inputrow { display:flex; align-items:center; gap:8px; padding:8px 10px; background:#f2f2f2; border-top:1px solid #ddd; }
  .inputrow input { flex:1; padding:10px 14px; font-size:16px; border:none; border-radius:20px; background:#fff; outline:none; }
  .send-btn { padding:10px 16px; font-size:15px; font-weight:bold; color:#fff; background:#143563; border:none; border-radius:20px; cursor:pointer; }

  .row { display:flex; margin:10px 0; }
  .row.me { justify-content:flex-end; }
  .msg { display:flex; flex-direction:column; max-width:60%; }
  .me .msg { align-items:flex-end; }
  .name { font-size:11px; color:#eaf0f8; margin:0 6px 2px; }
  .line { display:flex; align-items:flex-end; gap:5px; }
  .me .line { flex-direction:row-reverse; }
  .bubble { padding:10px 14px; border-radius:18px; color:#000; font-size:17px; line-height:1.4; word-break:break-word; }
  .me .bubble { background:#8de055; border-top-right-radius:4px; }
  .other .bubble { background:#ffffff; border-top-left-radius:4px; }
  .time { font-size:10px; color:#eaf0f8; white-space:nowrap; }

  .sys { text-align:center; margin:10px 0; }
  .sys span { display:inline-block; background:rgba(0,0,0,0.25); color:#fff; font-size:12px; padding:4px 12px; border-radius:12px; }
  .emoji-btn { background:none; border:none; font-size:22px; line-height:1; padding:0 2px; cursor:pointer; }
  .emoji-panel { display:none; flex-wrap:wrap; gap:2px; padding:8px; background:#f2f2f2; border-top:1px solid #ddd; max-height:130px; overflow:auto; }
  .emoji-item { background:none; border:none; font-size:24px; line-height:1; padding:5px; cursor:pointer; }
  .bell-btn { margin-left:auto; background:none; border:none; color:#fff; font-size:20px; line-height:1; padding:4px 2px; cursor:pointer; }
  .meta { display:flex; flex-direction:column; align-items:flex-start; }
  .me .meta { align-items:flex-end; }
  .read { font-size:10px; color:#eaf0f8; white-space:nowrap; }

  .admin-row { text-align:right; margin-top:16px; }
  .admin-link { background:none; border:none; color:#888; font-size:12px; text-decoration:underline; cursor:pointer; padding:4px; }
  .admin-box { padding:28px 24px; text-align:center; }
  .admin-box h1 { margin:6px 0 4px; font-size:22px; }
  .admin-box input { width:100%; box-sizing:border-box; padding:12px; font-size:16px; border:2px solid #ddd; border-radius:10px; outline:none; }
  .admin-box input:focus { border-color:#143563; }
  .main-btn.danger { background:#e53935; }
  .main-btn.danger:hover { background:#c62828; }
  .admin-msg { font-size:13px; min-height:18px; margin:12px 0 0; color:#c62828; }
  .admin-h2 { font-size:15px; margin:22px 0 8px; padding-top:16px; border-top:1px solid #eee; }
  .admin-log { text-align:left; font-size:12px; color:#555; max-height:150px; overflow:auto; background:#f7f7f7; border-radius:8px; padding:8px; }
  .admin-log div { margin:3px 0; }
  #adminPanel { max-width:780px; }
  .admin-cols { display:flex; gap:24px; flex-wrap:wrap; }
  .admin-col { flex:1; min-width:260px; }
  .admin-col .admin-log { height:200px; max-height:none; margin-bottom:14px; }
  .admin-log label { display:flex; gap:8px; align-items:center; margin:6px 0; font-size:12px; color:#555; }
  .admin-log input { width:auto; padding:0; margin:0; border:none; }
  .room-row { display:flex; align-items:center; gap:6px; margin:6px 0; }
  .admin-log .room-row label { flex:1; margin:0; }
  .mini-btn { font-size:11px; padding:4px 9px; border:1px solid #143563; color:#143563; background:#fff; border-radius:12px; cursor:pointer; white-space:nowrap; }
</style>
</head>
<body>

<div id="app">
  <div id="entrance" class="card">
    <div class="logo">☺︎</div>
    <h1>ログイン</h1>
    <p class="sub">ログインIDとユーザ名を入れてください</p>
    <label>ログインID</label>
    <input id="room" type="text" placeholder="例: ログインIDを入力">
    <label>ユーザ名</label>
    <input id="nick" type="text" placeholder="例: ユーザ名を入力" maxlength="20">
    <button class="main-btn" onclick="enter()">ログイン</button>
    <div class="admin-row"><button class="admin-link" onclick="showAdminLogin()">管理者専用ログイン</button></div>
  </div>

  <div id="chat" style="display:none;">
    <div class="header">
      <button class="back-btn" onclick="leave()" aria-label="ログイン画面に戻る">‹</button>
      <span id="title"></span>
      <button class="bell-btn" id="bell" onclick="toggleSound()" aria-label="通知音のオン・オフ">🔔</button>
    </div>
    <div id="log"></div>
    <div id="emojiPanel" class="emoji-panel"></div>
    <div class="inputrow">
      <button class="emoji-btn" type="button" onclick="toggleEmoji()" aria-label="絵文字">😀</button>
      <input id="msg" type="text" placeholder="メッセージを入力" maxlength="500">
      <button class="send-btn" onclick="send()">送信</button>
    </div>
  </div>
  <div id="adminLogin" class="card" style="display:none;">
    <div class="admin-box">
      <h1>管理者ログイン</h1>
      <p class="sub">ユーザ名と、管理者のメールアドレス・パスワードを入れてください</p>
      <label>ユーザ名</label>
      <input id="adminNick" type="text" maxlength="20" autocomplete="off">
      <label>メールアドレス</label>
      <input id="adminMail" type="email" autocomplete="off">
      <label>パスワード</label>
      <input id="adminPass" type="password" autocomplete="off">
      <button class="main-btn" onclick="adminSignIn()">ログイン</button>
      <p id="adminLoginMsg" class="admin-msg"></p>
      <button class="admin-link" onclick="adminBack()">‹ 戻る</button>
    </div>
  </div>

  <div id="adminPanel" class="card" style="display:none;">
    <div class="admin-box">
      <div class="admin-cols">
        <div class="admin-col">
          <h1>ルーム一覧</h1>
          <p class="sub">消したいルームにチェックを入れてください</p>
          <div id="adminRoomList" class="admin-log"></div>
          <button class="main-btn danger" style="margin-top:0;" onclick="deleteSelectedRooms()">選んだルームを消す</button>
          <button class="admin-link" onclick="deleteAllRooms()">全部消す</button>
          <p id="adminMsg" class="admin-msg"></p>
        </div>
        <div class="admin-col">
          <h1>ログイン履歴</h1>
          <p class="sub">消したい履歴にチェックを入れてください</p>
          <div id="adminLogList" class="admin-log"></div>
          <button class="main-btn danger" style="margin-top:0;" onclick="deleteSelectedLog()">選んだ履歴を消す</button>
          <button class="admin-link" onclick="clearAdminLog()">全部消す</button>
        </div>
      </div>
      <button class="admin-link" onclick="adminLogout()">ログアウトして戻る</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCMghUUZCVUxaTGW2Vel81fnpgG9VoXZ1E",
  authDomain: "my-chat-gogo.firebaseapp.com",
  databaseURL: "https://my-chat-gogo-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "my-chat-gogo",
  storageBucket: "my-chat-gogo.firebasestorage.app",
  messagingSenderId: "1093910430821",
  appId: "1:1093910430821:web:ec6a8c6b3945af1b27328c"
});
const db = firebase.database();

const myId = "u" + Math.random().toString(36).slice(2) + Date.now().toString(36);
let roomName = "";
let nickname = "";
let roomRef = null;

let fromAdminMode = false;
let viewMode = false;

function enter() {
  const name = document.getElementById("room").value.trim();
  if (name === "") return;
  let nick = document.getElementById("nick").value.trim();
  if (nick === "") nick = "名無しさん";
  enterRoom(name, nick, false, false);
}

function enterRoom(name, nick, fromAdmin, viewOnly) {
  roomName = name;
  nickname = nick;
  fromAdminMode = fromAdmin;
  viewMode = viewOnly;

  const key = roomName.replace(/[.#$\[\]\/]/g, "_");
  roomRef = db.ref("rooms/" + key + "/messages");
  readsRef = viewOnly ? null : db.ref("rooms/" + key + "/reads");
  myKey = nickname.replace(/[.#$\[\]\/]/g, "_");

  document.getElementById("title").textContent = roomName + (viewOnly ? "(閲覧のみ)" : "");
  document.querySelector(".inputrow").style.display = viewOnly ? "none" : "flex";
  document.getElementById("emojiPanel").style.display = "none";
  ["entrance", "adminLogin", "adminPanel"].forEach(function(x) {
    document.getElementById(x).style.display = "none";
  });
  document.getElementById("chat").style.display = "flex";

  unlockAudio();
  startListening();
  if (!viewOnly) {
    startReads();
    sendSystem(nickname + "さんが入室しました");
  }
}

const EMOJIS = ["😀","😂","🤣","😊","😍","😘","😎","🥹","🥺","😭","😡","😴","🤔","😅","🙄","😇","👍","👏","🙏","🙌","💪","🎉","❤️","🔥","✨","💯","🍀","🌸","🍙","☕"];

function buildEmojiPanel() {
  const p = document.getElementById("emojiPanel");
  EMOJIS.forEach(function(e) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "emoji-item";
    b.textContent = e;
    b.onclick = function() {
      const box = document.getElementById("msg");
      if (box.value.length + e.length <= 500) box.value += e;
      box.focus();
    };
    p.appendChild(b);
  });
}

function toggleEmoji() {
  const p = document.getElementById("emojiPanel");
  p.style.display = (p.style.display === "flex") ? "none" : "flex";
}

buildEmojiPanel();

let listening = null;
let readsRef = null;
let myKey = "";
let reads = {};
let myMsgs = [];
let markTimer = null;
let loaded = false;
let soundOn = true;
let audioCtx = null;

function unlockAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) {}
}

function playPop() {
  if (!soundOn || !audioCtx) return;
  try {
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(320, t);
    osc.frequency.exponentialRampToValueAtTime(900, t + 0.09);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.35, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.18);
  } catch (e) {}
}

function toggleSound() {
  soundOn = !soundOn;
  document.getElementById("bell").textContent = soundOn ? "🔔" : "🔕";
  unlockAudio();
  if (soundOn) playPop();
}

function startListening() {
  if (listening) listening.off();
  loaded = false;
  document.getElementById("log").innerHTML = "";
  myMsgs = [];

  listening = roomRef.limitToLast(100);
  listening.on("child_added", function(snap) {
    const m = snap.val();
    if (m.type === "system") {
      addSystem(m.text);
      return;
    }
    const who = m.name === nickname ? "me" : "other";
    const readEl = addMessage(who, m.name, m.text, m.time);
    if (who === "me") {
      myMsgs.push({ el: readEl, time: m.time });
      updateReadMarks();
    } else {
      scheduleMarkRead();
      if (loaded && !viewMode) playPop();
    }
  });
  listening.once("value", function() { loaded = true; });
}

function addSystem(text) {
  const log = document.getElementById("log");
  const row = document.createElement("div");
  row.className = "sys";
  const s = document.createElement("span");
  s.textContent = text;
  row.appendChild(s);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
}

function sendSystem(text) {
  roomRef.push({
    uid: myId,
    name: nickname,
    text: text,
    time: firebase.database.ServerValue.TIMESTAMP,
    type: "system"
  });
}

function startReads() {
  reads = {};
  readsRef.on("value", function(snap) {
    reads = snap.val() || {};
    updateReadMarks();
  });
  scheduleMarkRead();
}

function scheduleMarkRead() {
  if (markTimer) clearTimeout(markTimer);
  markTimer = setTimeout(markRead, 400);
}

function markRead() {
  if (!readsRef || document.visibilityState !== "visible") return;
  readsRef.child(myKey).set(firebase.database.ServerValue.TIMESTAMP);
}

function updateReadMarks() {
  myMsgs.forEach(function(item) {
    let n = 0;
    Object.keys(reads).forEach(function(k) {
      if (k !== myKey && reads[k] >= item.time) n++;
    });
    item.el.textContent = n > 0 ? "既読 " + n : "";
  });
}

document.addEventListener("visibilitychange", function() {
  if (document.visibilityState === "visible") scheduleMarkRead();
});

function leave() {
  if (listening) { listening.off(); listening = null; }
  roomRef = null;
  if (readsRef) { readsRef.off(); readsRef = null; }
  reads = {};
  myMsgs = [];
  document.getElementById("log").innerHTML = "";
  document.getElementById("chat").style.display = "none";
  document.querySelector(".inputrow").style.display = "flex";
  document.getElementById("emojiPanel").style.display = "none";
  showScreen(fromAdminMode ? "adminPanel" : "entrance");
  fromAdminMode = false;
  viewMode = false;
}

function formatTime(ts) {
  const d = ts ? new Date(ts) : new Date();
  const h = String(d.getHours()).padStart(2, "0");
  const m = String(d.getMinutes()).padStart(2, "0");
  return h + ":" + m;
}

function addMessage(who, name, text, ts) {
  const log = document.getElementById("log");

  const row = document.createElement("div");
  row.className = "row " + who;

  const msg = document.createElement("div");
  msg.className = "msg";

  const nameTag = document.createElement("div");
  nameTag.className = "name";
  nameTag.textContent = name;

  const line = document.createElement("div");
  line.className = "line";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  const time = document.createElement("div");
  time.className = "time";
  time.textContent = formatTime(ts);

  const meta = document.createElement("div");
  meta.className = "meta";
  let readEl = null;
  if (who === "me") {
    readEl = document.createElement("div");
    readEl.className = "read";
    meta.appendChild(readEl);
  }
  meta.appendChild(time);

  line.appendChild(bubble);
  line.appendChild(meta);
  msg.appendChild(nameTag);
  msg.appendChild(line);
  row.appendChild(msg);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return readEl;
}

function send() {
  const box = document.getElementById("msg");
  const text = box.value.trim();
  if (text === "" || roomRef === null) return;
  box.value = "";

  roomRef.push({
    uid: myId,
    name: nickname,
    text: text,
    time: firebase.database.ServerValue.TIMESTAMP
  }).catch(function(err) {
    alert("送信できませんでした: " + err.message);
  });
}

function showScreen(id) {
  ["entrance", "adminLogin", "adminPanel"].forEach(function(x) {
    document.getElementById(x).style.display = (x === id) ? "block" : "none";
  });
}

function showAdminLogin() {
  document.getElementById("adminLoginMsg").textContent = "";
  showScreen("adminLogin");
}

function adminBack() {
  showScreen("entrance");
}

function adminSignIn() {
  const mail = document.getElementById("adminMail").value.trim();
  const pass = document.getElementById("adminPass").value;
  const msg = document.getElementById("adminLoginMsg");
  const nick = document.getElementById("adminNick").value.trim();
  if (nick === "") {
    msg.textContent = "ユーザ名を入れてください";
    document.getElementById("adminNick").focus();
    return;
  }
  if (mail === "" || pass === "") return;
  msg.textContent = "確認中...";
  firebase.auth().signInWithEmailAndPassword(mail, pass).then(function() {
    document.getElementById("adminPass").value = "";
    document.getElementById("adminMsg").textContent = "";
    showScreen("adminPanel");
    adminName = nick;
    recordLogin("success", nick);
    loadAdminLog();
    loadAdminRooms();
  }).catch(function(err) {
    msg.textContent = "ログインできませんでした (" + err.code + ")";
    recordLogin(err.code, nick);
  });
}

function recordLogin(code, nick) {
  db.ref("adminLog").push({
    time: firebase.database.ServerValue.TIMESTAMP,
    code: String(code || "unknown").slice(0, 60),
    nick: String(nick || "").slice(0, 20)
  });
}

let adminLogRef = null;

function loadAdminLog() {
  const box = document.getElementById("adminLogList");
  if (adminLogRef) adminLogRef.off();
  adminLogRef = db.ref("adminLog").limitToLast(20);
  adminLogRef.on("value", function(snap) {
    const items = [];
    snap.forEach(function(c) { items.push({ key: c.key, v: c.val() }); });
    items.reverse();
    const checkedLog = {};
    box.querySelectorAll("input:checked").forEach(function(i) { checkedLog[i.value] = true; });
    box.innerHTML = "";
    if (items.length === 0) {
      box.textContent = "ログイン履歴はありません";
      return;
    }
    items.forEach(function(it) {
      const lab = document.createElement("label");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.value = it.key;
      cb.checked = !!checkedLog[it.key];
      const span = document.createElement("span");
      const t = new Date(it.v.time);
      const code = it.v.code;
      let label = "失敗";
      let color = "#c62828";
      let tail = "  " + code;
      if (code === "success") {
        label = "成功";
        color = "#2e7d32";
        tail = "";
      } else if (code === "delete-all") {
        label = "削除";
        color = "#e65100";
        tail = "  全てのルームを削除";
      } else if (code === "delete-rooms") {
        label = "削除";
        color = "#e65100";
        tail = "  " + (it.v.detail || "") + "のルームを削除";
      }
      const badge = document.createElement("b");
      badge.textContent = label;
      badge.style.color = color;
      span.appendChild(document.createTextNode((t.getMonth() + 1) + "/" + t.getDate() + " " + formatTime(it.v.time) + "  "));
      span.appendChild(badge);
      span.appendChild(document.createTextNode((it.v.nick ? "  「" + it.v.nick + "」" : "") + tail));
      lab.appendChild(cb);
      lab.appendChild(span);
      box.appendChild(lab);
    });
  }, function() {
    box.textContent = "記録を読み込めませんでした";
  });
}

function deleteSelectedLog() {
  const checks = document.querySelectorAll("#adminLogList input:checked");
  if (checks.length === 0) {
    alert("消したい履歴にチェックを入れてな");
    return;
  }
  if (!confirm(checks.length + "件の履歴を消します。ええですか?")) return;
  const updates = {};
  checks.forEach(function(c) { updates[c.value] = null; });
  db.ref("adminLog").update(updates);
}

function clearAdminLog() {
  if (!confirm("ログイン履歴を全部消します。ええですか?")) return;
  db.ref("adminLog").remove();
}

let adminName = "";
let adminRoomsRef = null;

function loadAdminRooms() {
  const box = document.getElementById("adminRoomList");
  if (adminRoomsRef) adminRoomsRef.off();
  adminRoomsRef = db.ref("rooms");
  adminRoomsRef.on("value", function(snap) {
    const checked = {};
    box.querySelectorAll("input:checked").forEach(function(i) { checked[i.value] = true; });
    box.innerHTML = "";
    const rooms = [];
    snap.forEach(function(c) {
      let count = 0;
      c.child("messages").forEach(function(m) {
        const v = m.val();
        if (v && v.type !== "system") count++;
      });
      rooms.push({ key: c.key, count: count });
    });
    if (rooms.length === 0) {
      box.textContent = "ルームはありません";
      return;
    }
    rooms.forEach(function(r) {
      const row = document.createElement("div");
      row.className = "room-row";

      const lab = document.createElement("label");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.value = r.key;
      cb.checked = !!checked[r.key];
      const span = document.createElement("span");
      span.textContent = r.key + "(メッセージ " + r.count + "件)";
      lab.appendChild(cb);
      lab.appendChild(span);

      const viewBtn = document.createElement("button");
      viewBtn.type = "button";
      viewBtn.className = "mini-btn";
      viewBtn.textContent = "見る";
      viewBtn.onclick = function() { enterRoom(r.key, "", true, true); };

      const joinBtn = document.createElement("button");
      joinBtn.type = "button";
      joinBtn.className = "mini-btn";
      joinBtn.textContent = "入る";
      joinBtn.onclick = function() { enterRoom(r.key, adminName, true, false); };

      row.appendChild(lab);
      row.appendChild(viewBtn);
      row.appendChild(joinBtn);
      box.appendChild(row);
    });
  }, function() {
    box.textContent = "ルームを読み込めませんでした";
  });
}

function recordAdminAction(code, detail) {
  const rec = {
    time: firebase.database.ServerValue.TIMESTAMP,
    code: code,
    nick: adminName.slice(0, 20)
  };
  if (detail) rec.detail = String(detail).slice(0, 200);
  db.ref("adminLog").push(rec);
}

function showAdminResult(ok, text) {
  const msg = document.getElementById("adminMsg");
  msg.style.color = ok ? "#2e7d32" : "#c62828";
  msg.textContent = text;
}

function deleteSelectedRooms() {
  const checks = document.querySelectorAll("#adminRoomList input:checked");
  if (checks.length === 0) {
    alert("消したいルームにチェックを入れてな");
    return;
  }
  const keys = [];
  checks.forEach(function(c) { keys.push(c.value); });
  if (!confirm(keys.length + "個のルームの履歴を消します。元に戻せません。ええですか?")) return;
  const updates = {};
  keys.forEach(function(k) { updates[k] = null; });
  db.ref("rooms").update(updates).then(function() {
    recordAdminAction("delete-rooms", keys.join("、"));
    showAdminResult(true, "消しました");
  }).catch(function(err) {
    showAdminResult(false, "消せませんでした (" + err.code + ")");
  });
}

function deleteAllRooms() {
  if (!confirm("全部のルームの履歴を消します。元に戻せません。ええですか?")) return;
  db.ref("rooms").remove().then(function() {
    recordAdminAction("delete-all", "");
    showAdminResult(true, "消しました");
  }).catch(function(err) {
    showAdminResult(false, "消せませんでした (" + err.code + ")");
  });
}

function adminLogout() {
  if (adminLogRef) { adminLogRef.off(); adminLogRef = null; }
  if (adminRoomsRef) { adminRoomsRef.off(); adminRoomsRef = null; }
  firebase.auth().signOut().then(function() {
    showScreen("entrance");
  });
}

document.getElementById("adminPass").addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.isComposing) adminSignIn();
});

document.getElementById("room").addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.isComposing) enter();
});

document.getElementById("nick").addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.isComposing) enter();
});

document.getElementById("msg").addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.isComposing) send();
});
</script>

</body>
