<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>login-ログイン-</title>
<style>
  html, body { margin:0; }
  #app { min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:"Hiragino Sans","Meiryo",sans-serif; color:#333; }
  .card { width:100%; max-width:380px; background:#fff; border-radius:18px; box-shadow:0 6px 20px rgba(0,0,0,0.15); overflow:hidden; }

  #entrance { padding:28px 24px; text-align:center; }
  .logo { font-size:48px; }
  #entrance h1 { margin:6px 0 4px; font-size:22px; }
  .sub { margin:0 0 20px; font-size:13px; color:#888; }
  label { display:block; text-align:left; font-size:12px; color:#666; margin:12px 0 4px; }
  #entrance input { width:100%; box-sizing:border-box; padding:12px; font-size:16px; border:2px solid #ddd; border-radius:10px; outline:none; }
  #entrance input:focus { border-color:#4caf50; }
  .main-btn { width:100%; margin-top:22px; padding:13px; font-size:16px; font-weight:bold; color:#fff; background:#4caf50; border:none; border-radius:10px; cursor:pointer; }
  .main-btn:hover { background:#43a047; }

  #chat { width:100%; max-width:1180px; height:100vh; flex-direction:column; background:#7494c0; }
  .header { background:#143563; color:#fff; padding:10px 16px; font-size:17px; font-weight:bold; text-align:left; display:flex; align-items:center; gap:8px; }
  .back-btn { background:none; border:none; color:#fff; font-size:30px; line-height:1; padding:0 8px 4px 0; cursor:pointer; }
  #log { flex:1; min-height:0; overflow:auto; padding:14px; }
  .inputrow { display:flex; align-items:center; gap:8px; padding:8px 10px; background:#f2f2f2; border-top:1px solid #ddd; }
  .inputrow input { flex:1; padding:10px 14px; font-size:16px; border:none; border-radius:20px; background:#fff; outline:none; }
  .send-btn { padding:10px 16px; font-size:15px; font-weight:bold; color:#fff; background:#143563; border:none; border-radius:20px; cursor:pointer; }

  .row { display:flex; margin:10px 0; }
  .row.me { justify-content:flex-end; }
  .msg { display:flex; flex-direction:column; max-width:60%; }
  .me .msg { align-items:flex-end; }
  .name { font-size:11px; color:#eaf0f8; margin:0 6px 2px; }
  .line { display:flex; align-items:flex-end; gap:5px; }
  .me .line { flex-direction:row-reverse; }
  .bubble { padding:10px 14px; border-radius:18px; color:#000; font-size:17px; line-height:1.4; word-break:break-word; }
  .me .bubble { background:#8de055; border-top-right-radius:4px; }
  .other .bubble { background:#ffffff; border-top-left-radius:4px; }
  .time { font-size:10px; color:#eaf0f8; white-space:nowrap; }

  .sys { text-align:center; margin:10px 0; }
  .sys span { display:inline-block; background:rgba(0,0,0,0.25); color:#fff; font-size:12px; padding:4px 12px; border-radius:12px; }
  .meta { display:flex; flex-direction:column; align-items:flex-start; }
  .me .meta { align-items:flex-end; }
  .read { font-size:10px; color:#eaf0f8; white-space:nowrap; }

  .admin-row { text-align:right; margin-top:16px; }
  .admin-link { background:none; border:none; color:#888; font-size:12px; text-decoration:underline; cursor:pointer; padding:4px; }
  .admin-box { padding:28px 24px; text-align:center; }
  .admin-box h1 { margin:6px 0 4px; font-size:22px; }
  .admin-box input { width:100%; box-sizing:border-box; padding:12px; font-size:16px; border:2px solid #ddd; border-radius:10px; outline:none; }
  .admin-box input:focus { border-color:#143563; }
  .main-btn.danger { background:#e53935; }
  .main-btn.danger:hover { background:#c62828; }
  .admin-msg { font-size:13px; min-height:18px; margin:12px 0 0; color:#c62828; }
</style>
</head>
<body>

<div id="app">
  <div id="entrance" class="card">
    <div class="logo">☺︎</div>
    <h1>ログイン</h1>
    <p class="sub">ログインIDとユーザ名を入れてください</p>
    <label>ログインID</label>
    <input id="room" type="text" placeholder="例: ログインIDを入力">
    <label>ユーザ名</label>
    <input id="nick" type="text" placeholder="例: ユーザ名を入力" maxlength="20">
    <button class="main-btn" onclick="enter()">ログイン</button>
    <div class="admin-row"><button class="admin-link" onclick="showAdminLogin()">管理者専用ログイン</button></div>
  </div>

  <div id="chat" style="display:none;">
    <div class="header">
      <button class="back-btn" onclick="leave()" aria-label="ログイン画面に戻る">‹</button>
      <span id="title"></span>
    </div>
    <div id="log"></div>
    <div class="inputrow">
      <input id="msg" type="text" placeholder="メッセージを入力" maxlength="500">
      <button class="send-btn" onclick="send()">送信</button>
    </div>
  </div>
  <div id="adminLogin" class="card" style="display:none;">
    <div class="admin-box">
      <h1>管理者ログイン</h1>
      <p class="sub">管理者のメールアドレスとパスワードを入れてください</p>
      <label>メールアドレス</label>
      <input id="adminMail" type="email" autocomplete="off">
      <label>パスワード</label>
      <input id="adminPass" type="password" autocomplete="off">
      <button class="main-btn" onclick="adminSignIn()">ログイン</button>
      <p id="adminLoginMsg" class="admin-msg"></p>
      <button class="admin-link" onclick="adminBack()">‹ 戻る</button>
    </div>
  </div>

  <div id="adminPanel" class="card" style="display:none;">
    <div class="admin-box">
      <h1>履歴を消す</h1>
      <p class="sub">履歴を消したいルームIDを入れてください</p>
      <label>ルームID</label>
      <input id="adminRoom" type="text">
      <button class="main-btn danger" onclick="adminDelete()">履歴を消す</button>
      <p id="adminMsg" class="admin-msg"></p>
      <button class="admin-link" onclick="adminLogout()">ログアウトして戻る</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCMghUUZCVUxaTGW2Vel81fnpgG9VoXZ1E",
  authDomain: "my-chat-gogo.firebaseapp.com",
  databaseURL: "https://my-chat-gogo-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "my-chat-gogo",
  storageBucket: "my-chat-gogo.firebasestorage.app",
  messagingSenderId: "1093910430821",
  appId: "1:1093910430821:web:ec6a8c6b3945af1b27328c"
});
const db = firebase.database();

const myId = "u" + Math.random().toString(36).slice(2) + Date.now().toString(36);
let roomName = "";
let nickname = "";
let roomRef = null;

function enter() {
  const name = document.getElementById("room").value.trim();
  if (name === "") return;
  roomName = name;
  nickname = document.getElementById("nick").value.trim();
  if (nickname === "") nickname = "名無しさん";

  const key = roomName.replace(/[.#$\[\]\/]/g, "_");
  roomRef = db.ref("rooms/" + key + "/messages");
  readsRef = db.ref("rooms/" + key + "/reads");
  myKey = nickname.replace(/[.#$\[\]\/]/g, "_");

  document.getElementById("title").textContent = roomName;
  document.getElementById("entrance").style.display = "none";
  document.getElementById("chat").style.display = "flex";

  startListening();
  startReads();
  sendSystem(nickname + "さんが入室しました");
}

let listening = null;
let readsRef = null;
let myKey = "";
let reads = {};
let myMsgs = [];
let markTimer = null;

function startListening() {
  if (listening) listening.off();
  document.getElementById("log").innerHTML = "";
  myMsgs = [];

  listening = roomRef.limitToLast(100);
  listening.on("child_added", function(snap) {
    const m = snap.val();
    if (m.type === "system") {
      addSystem(m.text);
      return;
    }
    const who = m.name === nickname ? "me" : "other";
    const readEl = addMessage(who, m.name, m.text, m.time);
    if (who === "me") {
      myMsgs.push({ el: readEl, time: m.time });
      updateReadMarks();
    } else {
      scheduleMarkRead();
    }
  });
}

function addSystem(text) {
  const log = document.getElementById("log");
  const row = document.createElement("div");
  row.className = "sys";
  const s = document.createElement("span");
  s.textContent = text;
  row.appendChild(s);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
}

function sendSystem(text) {
  roomRef.push({
    uid: myId,
    name: nickname,
    text: text,
    time: firebase.database.ServerValue.TIMESTAMP,
    type: "system"
  });
}

function startReads() {
  reads = {};
  readsRef.on("value", function(snap) {
    reads = snap.val() || {};
    updateReadMarks();
  });
  scheduleMarkRead();
}

function scheduleMarkRead() {
  if (markTimer) clearTimeout(markTimer);
  markTimer = setTimeout(markRead, 400);
}

function markRead() {
  if (!readsRef || document.visibilityState !== "visible") return;
  readsRef.child(myKey).set(firebase.database.ServerValue.TIMESTAMP);
}

function updateReadMarks() {
  myMsgs.forEach(function(item) {
    let n = 0;
    Object.keys(reads).forEach(function(k) {
      if (k !== myKey && reads[k] >= item.time) n++;
    });
    item.el.textContent = n > 0 ? "既読 " + n : "";
  });
}

document.addEventListener("visibilitychange", function() {
  if (document.visibilityState === "visible") scheduleMarkRead();
});

function leave() {
  if (listening) { listening.off(); listening = null; }
  roomRef = null;
  if (readsRef) { readsRef.off(); readsRef = null; }
  reads = {};
  myMsgs = [];
  document.getElementById("log").innerHTML = "";
  document.getElementById("chat").style.display = "none";
  document.getElementById("entrance").style.display = "block";
}

function formatTime(ts) {
  const d = ts ? new Date(ts) : new Date();
  const h = String(d.getHours()).padStart(2, "0");
  const m = String(d.getMinutes()).padStart(2, "0");
  return h + ":" + m;
}

function addMessage(who, name, text, ts) {
  const log = document.getElementById("log");

  const row = document.createElement("div");
  row.className = "row " + who;

  const msg = document.createElement("div");
  msg.className = "msg";

  const nameTag = document.createElement("div");
  nameTag.className = "name";
  nameTag.textContent = name;

  const line = document.createElement("div");
  line.className = "line";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  const time = document.createElement("div");
  time.className = "time";
  time.textContent = formatTime(ts);

  const meta = document.createElement("div");
  meta.className = "meta";
  let readEl = null;
  if (who === "me") {
    readEl = document.createElement("div");
    readEl.className = "read";
    meta.appendChild(readEl);
  }
  meta.appendChild(time);

  line.appendChild(bubble);
  line.appendChild(meta);
  msg.appendChild(nameTag);
  msg.appendChild(line);
  row.appendChild(msg);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return readEl;
}

function send() {
  const box = document.getElementById("msg");
  const text = box.value.trim();
  if (text === "" || roomRef === null) return;
  box.value = "";

  roomRef.push({
    uid: myId,
    name: nickname,
    text: text,
    time: firebase.database.ServerValue.TIMESTAMP
  }).catch(function(err) {
    alert("送信できませんでした: " + err.message);
  });
}

function showScreen(id) {
  ["entrance", "adminLogin", "adminPanel"].forEach(function(x) {
    document.getElementById(x).style.display = (x === id) ? "block" : "none";
  });
}

function showAdminLogin() {
  document.getElementById("adminLoginMsg").textContent = "";
  showScreen("adminLogin");
}

function adminBack() {
  showScreen("entrance");
}

function adminSignIn() {
  const mail = document.getElementById("adminMail").value.trim();
  const pass = document.getElementById("adminPass").value;
  const msg = document.getElementById("adminLoginMsg");
  if (mail === "" || pass === "") return;
  msg.textContent = "確認中...";
  firebase.auth().signInWithEmailAndPassword(mail, pass).then(function() {
    document.getElementById("adminPass").value = "";
    document.getElementById("adminMsg").textContent = "";
    showScreen("adminPanel");
  }).catch(function(err) {
    msg.textContent = "ログインできませんでした (" + err.code + ")";
  });
}

function adminDelete() {
  const name = document.getElementById("adminRoom").value.trim();
  const msg = document.getElementById("adminMsg");
  if (name === "") return;
  if (!confirm("ルーム「" + name + "」の履歴を全部消します。元に戻せません。ええですか?")) return;
  const key = name.replace(/[.#$\[\]\/]/g, "_");
  db.ref("rooms/" + key).remove().then(function() {
    msg.style.color = "#2e7d32";
    msg.textContent = "消しました";
  }).catch(function(err) {
    msg.style.color = "#c62828";
    msg.textContent = "消せませんでした (" + err.code + ")";
  });
}

function adminLogout() {
  firebase.auth().signOut().then(function() {
    showScreen("entrance");
  });
}

document.getElementById("adminPass").addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.isComposing) adminSignIn();
});

document.getElementById("room").addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.isComposing) enter();
});

document.getElementById("nick").addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.isComposing) enter();
});

document.getElementById("msg").addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.isComposing) send();
});
</script>

</body>
</html>
